name: astrbot_plugin_pity_active_reply
display_name: 保底递增式主动回复
short_desc: 连续没插话时主动回复概率逐条升高，插话或被 @ 即重置，告别刷屏与长期沉默
desc: 保底递增式主动回复：替代原生主动回复的纯概率抽签，每条未唤醒 bot 的群消息按 p = min(base_prob + increment × 连续未插话条数, max_prob) 抽签，抽中主动插话或被 @ 被动回复后概率重置回初始值。概率三参数、硬保底条数、冷清清零、群白名单均可在 WebUI 插件配置中调整，无需改代码
help: '使用前必须关闭原生「主动回复」（WebUI → 配置 → 其他配置 → 群聊上下文感知 → 主动回复 → 关闭，否则一条消息会被回复两次），并保持「群聊上下文感知」本身开启（本插件依赖其群聊记录注入）。概率参数在 WebUI → 插件管理 → 本插件 → 配置 中修改，保存后重载插件生效。'
version: v1.0.2
author: "fengxue"
